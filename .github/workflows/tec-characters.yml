name: TEC characters run

on:
  schedule:
    - cron: "30 15 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Maximum session length"
        required: true
        default: "240"
        type: choice
        options:
          - "5"
          - "120"
          - "240"
          - "300"
          - "350"
      send_enabled:
        description: "Send public replies (unchecked = dry run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tec-characters-session
  cancel-in-progress: false

jobs:
  run-characters:
    name: TEC character session
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check required files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ["firestore_worker.py", "firestore_http.py", "personas/shared.txt"]
          required += ["personas/%s.txt" % n for n in ("mira", "dylan", "miko", "aegis", "astra")]
          bad = [n for n in required if not Path(n).is_file() or not Path(n).read_text(encoding="utf-8").strip()]
          if bad:
              raise SystemExit("Missing or empty files: " + ", ".join(bad))
          PY

      - name: Compile and test
        run: |
          python -m py_compile firestore_worker.py firestore_http.py test_firestore_worker.py
          python -m unittest discover -v

      - name: Validate secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_KEYS: ${{ secrets.FIREBASE_KEYS }}
        run: |
          [ -n "$GROQ_API_KEY" ] || { echo "Missing repository secret: GROQ_API_KEY"; exit 1; }
          [ -n "$FIREBASE_KEYS" ] || { echo "Missing repository secret: FIREBASE_KEYS"; exit 1; }
          python -c "import json,os; d=json.loads(os.environ['FIREBASE_KEYS']); assert d, 'empty'" || { echo "FIREBASE_KEYS must be valid JSON"; exit 1; }
      - name: Run characters
        env:
          FIREBASE_KEYS: ${{ secrets.FIREBASE_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEND_ENABLED: ${{ github.event_name == 'schedule' && 'true' || (inputs.send_enabled && 'true' || 'false') }}
          RUN_MINUTES: ${{ inputs.duration_minutes || '240' }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          WATCH_SERVERS: "1,2,3,4,5"
          POLL_SECONDS: "30"
          SLOW_FLOOR: "8"
          AMBIENT_HUMAN_CHANCE: "0.45"
          AMBIENT_AI_CHANCE: "0.3"
          MAX_RESPONDERS: "2"
          AI_CHAIN_LIMIT: "4"
          MAX_REPLIES: "300"
          QUOTA_COOLDOWN_SECONDS: "300"
        shell: bash
        run: |
          case "$RUN_MINUTES" in
            120|240|300|350) ;;
            *) echo "Invalid session duration."; exit 1 ;;
          esac

          {
            echo "## TEC character session"
            echo
            echo "- Maximum session: ${RUN_MINUTES} minutes"
            echo "- Public replies enabled: ${SEND_ENABLED}"
            echo "- No automatic restart"
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          timeout --signal=TERM --kill-after=30s "${RUN_MINUTES}m" python -u firestore_worker.py
          result=$?
          set -e

          if [ "$result" -eq 124 ]; then
            echo "Session reached its configured time limit."
            exit 0
          fi
          if [ "$result" -eq 0 ]; then
            echo "Characters stopped normally."
            exit 0
          fi
          echo "Worker exited with status ${result}."
          exit "$result"
